<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Three-cycle hydrogen and microbial evolution</title>
<style>
:root{color-scheme:light;font:15px system-ui,sans-serif;color:#183344;background:#f5f9fa}*{box-sizing:border-box}body{margin:0;padding:18px}.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}h1{font-size:20px;margin:0 auto 0 0}button,select{font:inherit;border:1px solid #b8cbd1;border-radius:8px;padding:9px;background:white;color:#183344}button{background:#087f82;color:white;min-width:86px;cursor:pointer}button:disabled{opacity:.5}label{font-size:13px}.controls{background:white;border:1px solid #dbe6e9;padding:14px;border-radius:12px;margin-bottom:14px}.timeline{display:flex;align-items:center;gap:14px;margin-top:10px}input[type=range]{width:100%;accent-color:#087f82}output{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:650}.stage{display:inline-block;padding:4px 9px;border-radius:20px;background:#e1f3f1;color:#076e72;font-weight:650;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:white;border:1px solid #dbe6e9;border-radius:12px;padding:12px;min-width:0}.panel h2{font-size:15px;margin:0 0 9px}.map{display:flex;align-items:center;gap:5px}.ylabel{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;white-space:nowrap}canvas{display:block;width:100%;aspect-ratio:1;min-width:0;background:#f8fafb;border:1px solid #c8d5dc}.xlabel{text-align:center;font-size:11px;margin:4px 0 9px}.legend{height:9px;border-radius:5px}.ticks{display:flex;justify-content:space-between;font-size:11px;margin-top:3px}#note{font-size:13px;line-height:1.5;margin:12px 0 0}.hint{font-size:12px;color:#536d7b;margin:0}.error{color:#9a3434}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #b37bd5;outline-offset:2px}@media(max-width:480px){body{padding:9px}.grid{gap:8px}.panel{padding:7px}.panel h2{font-size:12px}.ylabel{display:none}.top{gap:8px}h1{font-size:17px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<div class="top"><h1>Follow the plume through three cycles</h1><span id="stage" class="stage">Loading saved results…</span></div>
<div class="controls"><div class="top"><button id="play" disabled>Play</button><label>Workflow <select id="workflow"><option value="phreeqc">Compositional PHREEQC · cell-local microbes</option><option value="mobile">Flow–biochemistry · mobile microbes</option></select></label><label>Speed <select id="speed"><option value="900">Slow</option><option value="450" selected>Normal</option><option value="180">Fast</option></select></label></div><div class="timeline"><input id="time" type="range" min="0" max="1" value="0" aria-label="Saved simulation time"><output id="day">Day —</output></div><p class="hint">Scrub to inspect a saved state. Each map spans 0–50 m; the dark line marks the well. Colors use fixed logarithmic scales.</p></div>
<div class="grid" id="maps"></div><p id="note" role="status">Loading…</p>
<script>
'use strict';
const $=id=>document.getElementById(id);let data,fields,paths,panels,frame=0,timer=null;
function stop(){clearTimeout(timer);timer=null;$('play').textContent=frame===data.times.length-1?'Replay':'Play'}
function description(){return $('workflow').value==='phreeqc'?'PHREEQC populations stay cell-local: these panels show growth and decay, not bacterial migration.':'Mobile populations evolve through aqueous advection, growth and decay. A moving concentration front does not track individual bacteria.'}
function draw(){let key=$('workflow').value;let n=paths.length;for(let j=0;j<4;j++){let p=panels[j],ctx=p.ctx;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,600,600);ctx.setTransform(12,0,0,-12,0,600);let a=fields[key][j],palette=data.variables[j].palette;for(let i=0;i<n;i++){let c=palette[a[frame*n+i]];ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;ctx.fill(paths[i])}ctx.strokeStyle='#102d40';ctx.lineWidth=.22;ctx.beginPath();data.well.forEach((xy,i)=>i?ctx.lineTo(...xy):ctx.moveTo(...xy));ctx.stroke()}
$('time').value=frame;$('day').value=`Day ${data.times[frame].toFixed(1)}`;$('stage').textContent=data.phases[frame];$('note').textContent=description()+' Population colors show the model population scale divided by its initial value. These ratios are not an absolute biomass comparison between workflows.'}
function tick(){if(frame>=data.times.length-1){stop();return}frame++;draw();timer=setTimeout(tick,+$('speed').value)}
$('play').onclick=()=>{if(timer){stop();return}if(frame===data.times.length-1)frame=0;draw();$('play').textContent='Pause';timer=setTimeout(tick,+$('speed').value)};
$('time').oninput=()=>{frame=+$('time').value;stop();draw()};$('workflow').onchange=()=>draw();
new ResizeObserver(()=>{if(parent!==window)parent.postMessage({type:'h2sim-field-height',height:document.body.scrollHeight+36},location.origin)}).observe(document.body);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&data)stop()});
fetch('frames.json.gz').then(r=>{if(!r.ok)throw Error('Saved animation data could not be loaded.');return new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json()}).then(d=>{data=d;fields={};for(let k of Object.keys(d.runs))fields[k]=d.runs[k].map(s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)));paths=d.polygons.map(v=>{let p=new Path2D();v.forEach((xy,i)=>i?p.lineTo(...xy):p.moveTo(...xy));p.closePath();return p});panels=d.variables.map((v,j)=>{let el=document.createElement('section');el.className='panel';let colors=v.palette.filter((_,i)=>i%16===0||i===255).map(c=>`rgb(${c.join(',')})`).join(',');el.innerHTML=`<h2>${v.name}</h2><div class="map"><span class="ylabel">Height, y (m)</span><canvas width="600" height="600" role="img" aria-label="${v.name} spatial map"></canvas></div><div class="xlabel">Distance, x (m) · 0 to 50</div><div class="legend" style="background:linear-gradient(to right,${colors})"></div><div class="ticks"><span>10<sup>${v.lo}</sup></span><span>10<sup>${((v.lo+v.hi)/2).toFixed(1)}</sup></span><span>10<sup>${v.hi}</sup></span></div>`;$('maps').append(el);return{ctx:el.querySelector('canvas').getContext('2d')}});$('time').max=d.times.length-1;$('play').disabled=false;draw()}).catch(e=>{$('note').className='error';$('note').textContent=e.message});
</script></body></html>
