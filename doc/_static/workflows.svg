<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 353"><title>PHREEQC workflow ownership</title><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="#56747d" /></marker></defs><rect width="960" height="330" rx="20" fill="#f0f6f5" /><g font-family="Arial,sans-serif" fill="#183b44"><text x="30" y="45" font-size="20" font-weight="700">Two chemistry workflows. Explicit equation ownership.</text><text x="30" y="116" font-size="16">Compositional PHREEQC</text><text x="30" y="226" font-size="16">Multirate PHREEQC</text></g><g fill="white" stroke="#abc8c8"><rect x="285" y="80" width="240" height="64" rx="10" /><rect x="565" y="80" width="350" height="64" rx="10" /><rect x="285" y="190" width="165" height="64" rx="10" /><rect x="485" y="190" width="195" height="64" rx="10" /><rect x="715" y="190" width="200" height="64" rx="10" /></g><g font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#18434c"><text x="405" y="107" font-weight="700">MRST flow + transport</text><text x="405" y="129" font-size="12">One flow timestep</text><text x="740" y="107" font-weight="700">PHREEQC kinetics + chemistry</text><text x="740" y="129" font-size="12">Cell-local update</text><text x="367" y="216" font-weight="700">MRST flow</text><text x="367" y="239" font-size="12">Coarse timestep</text><text x="582" y="216" font-weight="700">MRST reactions</text><text x="582" y="239" font-size="12">Local substep</text><text x="815" y="216" font-weight="700">PHREEQC equilibrium</text><text x="815" y="239" font-size="12">Aqueous-only</text><text x="695" y="300" font-size="13">Repeat reactions + equilibrium for each substep</text></g><g stroke="#56747d" fill="none" stroke-width="1.5" marker-end="url(#arrow)"><path d="M525 112h33" /><path d="M450 222h28" /><path d="M680 222h28" /><path d="M815 254v18H582v-10" /></g><g data-h2sim-figure-branding="copyright"><g transform="translate(619.675 333.315) scale(0.303158)"><title